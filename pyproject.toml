[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fraud-strategy-advisory-engagement"
version = "0.1.0"
description = "An end-to-end fraud strategy consulting engagement simulation."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "duckdb",
    "ipykernel",
    "jupyter",
    "matplotlib",
    "pandas",
    "pyarrow",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
